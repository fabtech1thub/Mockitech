{% extends 'mocki/base.html' %}

{% block title %}404 — Page Not Found | MockiTech{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container">
        <p class="section-eyebrow">Error 404</p>
        <p class="error-code">404</p>
        <h1 class="section-title">Page not found</h1>
        <p class="section-lead mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('home') }}" class="btn btn-accent btn-lg">Back to home</a>
    </div>
</section>
{% endblock %}
